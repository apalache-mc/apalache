on:
  # Every pull request
  pull_request:
  #  Pushes into the trunk
  #  This is important to ensure the trunk is not broken and
  #  to populate the cache for future PRs.
  #  See https://github.community/t/actions-cache-cache-not-being-hit-despite-of-being-present/17956/3
  push:
    branches:
      - main

name: build

jobs:
  build-mdbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Compile mdBook
        run: |
          cd docs
          mdbook build

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: make fmt-check

  scaladoc-check:
    env:
      APALACHE_FATAL_WARNINGS: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
      - name: Check scaladoc
        run: sbt unidoc

  compiler-warnings:
    env:
      APALACHE_FATAL_WARNINGS: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
      - name: Coursier cache
        uses: coursier/cache-action@v6
      - name: Set APALACHE_HOME env
        # See https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
        run: echo "APALACHE_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Build and Unit Test
        run: make compile-strict
      - name: Cleanup before cache
        # See https://www.scala-sbt.org/1.x/docs/GitHub-Actions-with-sbt.html#Caching
        shell: bash
        run: |
          rm -rf "$HOME/.ivy2/local" || true
          find $HOME/Library/Caches/Coursier/v1        -name "ivydata-*.properties" -delete || true
          find $HOME/.ivy2/cache                       -name "ivydata-*.properties" -delete || true
          find $HOME/.cache/coursier/v1                -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt                              -name "*.lock"               -delete || true

  unit-tests:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      # Allows other OS tests to proceed even if one fails
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Coursier cache
        uses: coursier/cache-action@v6
      - name: Coursier setup
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25
          apps: sbt
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
      - name: Set APALACHE_HOME env
        # See https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
        run: echo "APALACHE_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Build and Unit Test
        run: make test
      - name: Cleanup before cache
        # See https://www.scala-sbt.org/1.x/docs/GitHub-Actions-with-sbt.html#Caching
        shell: bash
        run: |
          rm -rf "$HOME/.ivy2/local" || true
          find $HOME/Library/Caches/Coursier/v1        -name "ivydata-*.properties" -delete || true
          find $HOME/.ivy2/cache                       -name "ivydata-*.properties" -delete || true
          find $HOME/.cache/coursier/v1                -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt                              -name "*.lock"               -delete || true

  scala-cli-integration-tests:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      # Match the MDX configuration/OS matrix while running its entries as
      # independent jobs. The baseline jobs also cover configuration-independent commands.
      fail-fast: false
      matrix:
        include:
          - operating-system: ubuntu-latest
            test-configurations: general,oopsla19-z3
          - operating-system: macos-latest
            test-configurations: general,oopsla19-z3
          # Arrays and cvc5 have no expected OS-specific behavior in these
          # tests, so run them once on Ubuntu instead of repeating them on macOS.
          - operating-system: ubuntu-latest
            test-configurations: arrays-z3
          - operating-system: ubuntu-latest
            test-configurations: oopsla19-cvc5
    steps:
      - uses: actions/checkout@v6
      - name: Coursier cache
        uses: coursier/cache-action@v6
      - name: Coursier setup
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25
          apps: sbt
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
      - name: Set APALACHE_HOME env
        run: echo "APALACHE_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Test CLI integration timing report
        run: python3 -m unittest discover -s test -p 'test_cli_integration_timing_report.py'
      - name: Run Scala CLI integration tests
        run: make scala-integration
        env:
          APALACHE_CLI_TEST_CONFIGS: ${{ matrix.test-configurations }}
          APALACHE_CLI_TEST_TIMING: true
          APALACHE_CLI_TEST_TIMING_DIR: ${{ runner.temp }}/apalache-cli-integration-timings
      - name: Add CLI integration timings to the job summary
        if: always()
        shell: bash
        run: |
          python3 script/cli_integration_timing_report.py \
            --input "$RUNNER_TEMP/apalache-cli-integration-timings" \
            --markdown "$RUNNER_TEMP/cli-integration-timing-summary.md" \
            --csv "$RUNNER_TEMP/cli-integration-timings.csv" \
            --label "${{ matrix.operating-system }} / ${{ matrix.test-configurations }}"
          cat "$RUNNER_TEMP/cli-integration-timing-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CLI integration timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-integration-timings-${{ matrix.operating-system }}-${{ matrix.test-configurations }}
          path: |
            ${{ runner.temp }}/apalache-cli-integration-timings/*.jsonl
            ${{ runner.temp }}/cli-integration-timings.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup before cache
        # See https://www.scala-sbt.org/1.x/docs/GitHub-Actions-with-sbt.html#Caching
        shell: bash
        run: |
          rm -rf "$HOME/.ivy2/local" || true
          find $HOME/Library/Caches/Coursier/v1        -name "ivydata-*.properties" -delete || true
          find $HOME/.ivy2/cache                       -name "ivydata-*.properties" -delete || true
          find $HOME/.cache/coursier/v1                -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt                              -name "*.lock"               -delete || true

  universal-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build universal package
        run: sbt "Universal/packageBin"
      - name: Upload universal package
        uses: actions/upload-artifact@v7
        with:
          name: universal-package
          path: target/universal/apalache-*.zip
          if-no-files-found: error

  universal-package-smoke:
    needs: universal-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 25]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Download universal package
        uses: actions/download-artifact@v8
        with:
          name: universal-package
          path: package
      - name: Run packaged launcher on Java ${{ matrix.java-version }}
        shell: bash
        run: |
          unzip package/apalache-*.zip -d package-smoke
          package_dir=$(find package-smoke -mindepth 1 -maxdepth 1 -type d -name 'apalache-*' -print -quit)
          APALACHE_HOME="$package_dir" "$package_dir/bin/apalache-mc" check --smt-solver=z3 --length=2 --inv=Inv test/tla/Counter.tla
          APALACHE_HOME="$package_dir" "$package_dir/bin/apalache-mc" check --smt-solver=cvc5 --length=2 --inv=Inv test/tla/Counter.tla

  universal-package-windows-smoke:
    needs: universal-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Download universal package
        uses: actions/download-artifact@v8
        with:
          name: universal-package
          path: package
      - name: Run packaged Windows launcher
        shell: pwsh
        run: |
          $archive = Get-ChildItem package/apalache-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath package-smoke
          $launcher = Get-ChildItem package-smoke -Recurse -Filter apalache-mc.bat | Select-Object -First 1
          $env:APALACHE_HOME = $launcher.Directory.Parent.FullName

          $output = & $launcher.FullName version --debug 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) { exit $exitCode }

          foreach ($solver in @("z3", "cvc5")) {
            $output = & $launcher.FullName check "--smt-solver=$solver" --length=2 --inv=Inv test/tla/Counter.tla 2>&1
            $exitCode = $LASTEXITCODE
            $output | Write-Output
            if ($exitCode -ne 0) { exit $exitCode }
          }

  integration-tests:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      # Allows other OS tests to proceed even if one fails
      fail-fast: false
      matrix:
        include:
          - operating-system: ubuntu-latest
            smt-encoding: oopsla19
            smt-solver: z3
            test-filter: ""
          - operating-system: macos-latest
            smt-encoding: oopsla19
            smt-solver: z3
            test-filter: ""
          # Arrays and cvc5 have no expected OS-specific behavior in these
          # tests, so run them once on Ubuntu instead of repeating them on macOS.
          - operating-system: ubuntu-latest
            smt-encoding: arrays
            smt-solver: z3
            test-filter: array-encoding
          - operating-system: ubuntu-latest
            smt-encoding: oopsla19
            smt-solver: cvc5
            test-filter: ""
    steps:
      - uses: actions/checkout@v6
      - name: Cache local m2 repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-sbt-${{ hashFiles('project/Dependencies.scala') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
            ${{ runner.os }}-

      # ── Nix-based path (Linux only) ──────────────────────────────────────────
      - name: Cache nix store
        if: runner.os == 'Linux'
        # Workaround for cache action not playing well with permissions
        # See https://github.com/actions/cache/issues/324
        uses: john-shaffer/cache@59429c0461095f341a8cf7388e5d3aef37b95edd
        with:
          path: |
            /nix/store
            /nix/var/nix/profiles
          key: ${{ runner.os }}-nix-${{ hashFiles('**.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-
            ${{ runner.os }}-
      - name: Install Nix
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Validate dev-shell Java toolchain
        if: runner.os == 'Linux'
        run: |
          nix develop -c java -version
          nix develop -c sbt -batch 'eval require(System.getProperty("java.specification.version") == "25", "sbt must run on Java 25")'
      - name: Build and run integration tests
        if: runner.os == 'Linux'
        run: nix develop -c make integration
        env:
          SMT_SOLVER: ${{ matrix.smt-solver }}
          SMT_ENCODING: ${{ matrix.smt-encoding }}
          TEST_FILTER: ${{ matrix.test-filter }}

      # ── Direct path (macOS only, no Nix) ─────────────────────────────────────
      - name: Set up JDK 25
        if: runner.os == 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Coursier setup
        if: runner.os == 'macOS'
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25
          apps: sbt
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
        if: runner.os == 'macOS'
      - name: Set up OCaml
        if: runner.os == 'macOS'
        uses: ocaml/setup-ocaml@v3
        with:
          # Use OCaml 4.14 for compatibility with mdx 2.1.0
          ocaml-compiler: "4.14.x"
      - name: Install ocaml-mdx
        if: runner.os == 'macOS'
        # Pin mdx 2.1.0: newer versions have broken ellipsis matching
        # (https://github.com/realworldocaml/mdx/issues/428),
        # matching the version pinned in flake.nix.
        run: opam install mdx.2.1.0 --yes
      - name: Install Python dependencies
        if: runner.os == 'macOS'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install requests
      - name: Build and run integration tests
        if: runner.os == 'macOS'
        run: |
          eval $(opam env)
          source .venv/bin/activate
          source .envrc
          make integration
        env:
          SMT_SOLVER: ${{ matrix.smt-solver }}
          SMT_ENCODING: ${{ matrix.smt-encoding }}
          TEST_FILTER: ${{ matrix.test-filter }}

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # see: https://github.com/actions/runner-images/issues/10788
      - uses: sbt/setup-sbt@v1
      - name: Cache nix store
        # Workaround for cache action not playing well with permissions
        # See https://github.com/actions/cache/issues/324
        uses: john-shaffer/cache@59429c0461095f341a8cf7388e5d3aef37b95edd
        with:
          path: |
            /nix/store
            /nix/var/nix/profiles
          key: ${{ runner.os }}-nix-${{ hashFiles('**.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-
            ${{ runner.os }}-
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build the docker image
        run: nix develop -c make docker
      - name: Run integration tests in docker container
        run: |
          nix develop -c bash -c '
            export HOME="$PWD/test/tla"
            export JVM_ARGS="-Duser.home=/var/apalache"
            source ./test/.envrc
            test/mdx-test.py --debug
          '
        env:
          USE_DOCKER: true
          APALACHE_TAG: latest
