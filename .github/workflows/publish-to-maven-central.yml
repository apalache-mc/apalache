name: publish-to-maven-central

on:
  release:
    types:
      - published

permissions:
  contents: read

# Maven Central releases are immutable. Queue releases instead of allowing two
# publication jobs to overlap or canceling one that may already be uploading.
concurrency:
  group: publish-to-maven-central
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository_owner == 'apalache-mc' && github.event.release.prerelease == false }}
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Verify the release tag and version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          expected_tag="v${version}"

          if [[ "$version" == *-SNAPSHOT ]]
          then
              echo "error: Maven Central releases require a stable VERSION (found: $version)" >&2
              exit 1
          fi

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]
          then
              echo "error: version tag $RELEASE_TAG does not match VERSION $version (expected: $expected_tag)" >&2
              exit 1
          fi

      - name: Import the Maven signing key
        shell: bash
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$PGP_SECRET" ]]
          then
              echo "error: PGP_SECRET is not configured in the maven-central environment" >&2
              exit 1
          fi

          printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import

      - name: Publish tla-ir and tla-io
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
        run: ./script/publish-maven.sh release
