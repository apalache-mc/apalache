name: publish-to-maven-central

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the v prefix (for example, 0.59.0)
        required: true
        type: string

permissions:
  contents: read

# Maven Central releases are immutable. Queue releases instead of allowing two
# publication jobs to overlap or canceling one that may already be uploading.
concurrency:
  group: publish-to-maven-central
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        github.repository_owner == 'apalache-mc' &&
        (
          (github.event_name == 'release' && github.event.release.prerelease == false) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        )
      }}
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.event.release.tag_name }}

    steps:
      - name: Checkout the released version
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # A manual run may retry a release whose tag contains an older, broken
      # publishing script. Use the script from the workflow revision while
      # keeping the released source itself pinned to RELEASE_TAG.
      - name: Checkout current publishing automation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .publish-automation
          sparse-checkout: script/publish-maven.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Verify the release tag and version
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          expected_tag="v${version}"

          if [[ "$version" == *-SNAPSHOT ]]
          then
              echo "error: Maven Central releases require a stable VERSION (found: $version)" >&2
              exit 1
          fi

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]
          then
              echo "error: version tag $RELEASE_TAG does not match VERSION $version (expected: $expected_tag)" >&2
              exit 1
          fi

      - name: Import the Maven signing key
        shell: bash
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$PGP_SECRET" ]]
          then
              echo "error: PGP_SECRET is not configured in the maven-central environment" >&2
              exit 1
          fi

          printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import

      - name: Publish tla-ir, tla-ir-java, and tla-io
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PUBLISH_MAVEN_PROJECT_ROOT: ${{ github.workspace }}
          PUBLISH_MAVEN_SCRIPT: ${{ github.event_name == 'workflow_dispatch' && './.publish-automation/script/publish-maven.sh' || './script/publish-maven.sh' }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: |
          "$PUBLISH_MAVEN_SCRIPT" release
